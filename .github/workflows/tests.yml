name: Tests

on:
  push:
    branches:
      - dev
      - master
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'

    steps:
      - name: Checkout Core
        uses: actions/checkout@v4

      - name: Checkout Modulus (local path for *@dev)
        uses: actions/checkout@v4
        with:
          repository: InEngine/Modulus
          ref: feat/modulus-state-store
          path: Modules/Modulus
          # Default GITHUB_TOKEN cannot read other private org repos.
          token: ${{ secrets.INENGINE_CI_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, fileinfo
          coverage: none
          tools: composer:v2

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Enable CI path repository for Modulus
        run: |
          # composer.local merge-plugin is not loaded until installed; register the
          # path repo directly so *@dev resolves on the first composer update.
          composer config repositories.modulus '{"type":"path","url":"Modules/Modulus","options":{"symlink":true}}'
          cat > composer.local.json <<'EOF'
          {
              "repositories": [
                  {
                      "type": "path",
                      "url": "Modules/*",
                      "options": {
                          "symlink": true
                      }
                  }
              ]
          }
          EOF

      - name: Install Composer dependencies
        run: |
          # Skip scripts until APP_KEY exists (package:discover / ide-helper need it).
          composer update --no-interaction --prefer-dist --no-scripts
          cp .env.example .env
          php -r '$e=file_get_contents(".env"); $k="base64:".base64_encode(random_bytes(32)); file_put_contents(".env", preg_replace("/^APP_KEY=.*/m", "APP_KEY=".$k, $e));'
          composer dump-autoload --optimize
          php artisan package:discover --ansi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies and build
        run: |
          npm ci
          npm run build

      - name: Execute tests
        run: php -d memory_limit=512M artisan test --compact
