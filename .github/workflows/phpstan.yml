name: PHPStan

on:
  push:
    branches:
      - dev
      - master
      - main
    paths:
      - '**.php'
      - 'phpstan.neon'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/phpstan.yml'
  pull_request:
    paths:
      - '**.php'
      - 'phpstan.neon'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/phpstan.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpstan:
    name: phpstan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Core
        uses: actions/checkout@v4

      - name: Checkout Modulus (local path for *@dev)
        uses: actions/checkout@v4
        with:
          repository: InEngine/Modulus
          ref: feat/modulus-state-store
          path: Modules/Modulus
          # Default GITHUB_TOKEN cannot read other private org repos.
          token: ${{ secrets.INENGINE_CI_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_mysql, bcmath, intl, fileinfo
          coverage: none
          tools: composer:v2

      - name: Enable CI path repository for Modulus
        run: |
          cat > composer.local.json <<'EOF'
          {
              "repositories": [
                  {
                      "type": "path",
                      "url": "Modules/*",
                      "options": {
                          "symlink": true
                      }
                  }
              ]
          }
          EOF

      - name: Install Composer dependencies
        run: composer update --no-interaction --prefer-dist --optimize-autoloader

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --memory-limit=2G --error-format=github
